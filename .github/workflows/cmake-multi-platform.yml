# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main", "feat/ci" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/detect-build-changes.yml

  build:
    needs: changes
    if: ${{ always() }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        # os: [ubuntu-latest, windows-latest]
        os: [ubuntu-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          # - os: windows-latest
          #   c_compiler: cl
          #   cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          # - os: ubuntu-latest
          #   c_compiler: clang
          #   cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          # have some trouble C++20 feature
          - os: ubuntu-latest
            c_compiler: clang

    steps:
    - name: Require successful change detection
      if: needs.changes.result != 'success'
      run: |
        echo 'Change detection failed; refusing to report a successful build check.'
        exit 1

    - uses: actions/checkout@v4

    - name: Documentation-only change
      if: needs.changes.outputs.changed != 'true'
      run: echo 'No build-affecting changes; skipping dependency installation, build and tests.'

    - name: Set reusable strings
      if: needs.changes.outputs.changed == 'true'
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install Boost
      if: needs.changes.outputs.changed == 'true'
      uses: MarkusJx/install-boost@v2.6.0
      id: install-boost
      with:
        boost_version: 1.83.0
        platform_version: 22.04
        toolset: gcc

    - name: Install Dependencies
      run: |
        sudo apt-get update

        # sudo apt-get install libboost1.81-dev
        sudo apt-get install protobuf-compiler
        # sudo apt-get install libzmq5

        wget https://github.com/zeromq/libzmq/releases/download/v4.3.5/zeromq-4.3.5.tar.gz
        tar -xvf ./zeromq-4.3.5.tar.gz
        cd zeromq-4.3.5
        mkdir -p build && cd build
        cmake ..
        sudo make -j4 install
        cd ../..

        wget https://github.com/zeromq/cppzmq/archive/refs/tags/v4.10.0.tar.gz
        tar -xvf ./v4.10.0.tar.gz
        cd cppzmq-4.10.0
        mkdir -p build && cd build
        cmake ..
        sudo make -j4 install
        cd ../..

      if: needs.changes.outputs.changed == 'true' && runner.os == 'Linux'

    - name: Prepare Proto
      if: needs.changes.outputs.changed == 'true'
      run: ./protoc.sh

    - name: Configure CMake
      if: needs.changes.outputs.changed == 'true'
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBoost_ROOT=${{ steps.install-boost.outputs.BOOST_ROOT }}
        -DBoost_DIR=${{ steps.install-boost.outputs.BOOST_ROOT }}/lib/cmake/Boost-1.83.0
        -DBoost_INCLUDE_DIR=${{ steps.install-boost.outputs.BOOST_ROOT }}/include
        -DBoost_LIBRARY_DIRS=${{ steps.install-boost.outputs.BOOST_ROOT }}/lib
        -S ${{ github.workspace }}
      env:
        BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}

    - name: Build affected targets
      if: needs.changes.outputs.changed == 'true'
      env:
        BUILD_TARGETS: ${{ needs.changes.outputs.targets }}
      run: |
        read -r -a targets <<< "$BUILD_TARGETS"
        cmake --build "${{ steps.strings.outputs.build-output-dir }}" \
          --config "${{ matrix.build_type }}" --target "${targets[@]}" --parallel 2

    - name: Test shared library
      if: needs.changes.outputs.libs == 'true'
      run: ctest --test-dir build/rsp-libs --build-config Release --output-on-failure --no-tests=error

    - name: Test client
      if: needs.changes.outputs.client == 'true'
      run: ctest --test-dir build/rsp-cli --build-config Release --output-on-failure --no-tests=error

    - name: Test room
      if: needs.changes.outputs.room == 'true'
      run: ctest --test-dir build/rsp-svr/room --build-config Release --output-on-failure --no-tests=error

    - name: Two-client chat and leave-room E2E
      if: needs.changes.outputs.e2e == 'true'
      timeout-minutes: 3
      run: python3 tests/e2e_chat.py --build-dir build --log-dir build/e2e-logs

    - name: Room-unavailable timeout E2E
      if: needs.changes.outputs.e2e == 'true'
      timeout-minutes: 1
      run: python3 tests/e2e_room_timeout.py --build-dir build --log-dir build/e2e-logs

    - name: Print E2E process logs on failure
      if: failure()
      run: |
        python3 - <<'PY'
        from pathlib import Path
        for path in sorted(Path("build/e2e-logs").glob("*.log")):
            print(f"::group::{path.name}", flush=True)
            print(path.read_text(errors="replace"), flush=True)
            print("::endgroup::", flush=True)
        PY

